<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcement · Jacaranda City</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/output.css">
</head>
<body>
  <div id="navbar"></div>

  <main id="main" class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
    <nav aria-label="Breadcrumb" class="eyebrow text-muted">
      <a href="announcements.html" class="text-jacaranda-deep underline underline-offset-4 hover:text-jacaranda">Announcements</a>
      <span aria-hidden="true">/</span>
      <span id="crumb-title" aria-current="page">…</span>
    </nav>

    <div id="announcement-loading" class="mt-6 space-y-4" aria-busy="true">
      <div class="skeleton h-12 w-2/3"></div><div class="skeleton h-4 w-48"></div><div class="skeleton h-64 rounded-3xl"></div>
    </div>
    <div id="announcement-error" class="mt-6" hidden></div>

    <article id="announcement" hidden>
      <div class="mt-4 flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 id="title" class="text-4xl font-extrabold tracking-tight text-balance sm:text-5xl"></h1>
          <p id="meta" class="eyebrow mt-3 text-muted"></p>
        </div>
        <!-- admin only: manage this clip -->
        <div data-role="admin" id="admin-actions" class="flex flex-wrap gap-2"></div>
      </div>

      <section class="relative mt-8 overflow-hidden rounded-3xl bg-ink p-6 text-white sm:p-8" aria-label="Audio player">
        <div class="pointer-events-none absolute -top-24 -right-24 size-72 rounded-full bg-jacaranda/30 blur-3xl" aria-hidden="true"></div>

        <audio id="audio" preload="metadata">
          <p>Your browser can't play this file. <a id="fallback-link" class="underline">Download it here</a> instead.</p>
        </audio>

        <div class="relative flex items-center gap-5 sm:gap-7">
          <button id="play" type="button" class="grid size-16 shrink-0 place-items-center rounded-full bg-jacaranda shadow-lg shadow-jacaranda/30 hover:bg-jacaranda-light sm:size-20" aria-label="Play">
            <span data-icon="play" class="*:fill-current size-7 translate-x-px"></span>
          </button>
          <div class="min-w-0 flex-1">
            <div id="wave" class="flex h-14 items-center justify-between gap-[3px] overflow-hidden" aria-hidden="true"></div>
            <label for="seek" class="sr-only">Position in the clip</label>
            <input id="seek" type="range" min="0" max="100" step="0.1" value="0" class="mt-3 w-full cursor-pointer accent-jacaranda-light">
            <div class="mt-1 flex justify-between text-sm font-bold tabular-nums">
              <span id="current-time">0:00</span><span id="total-time">–:––</span>
            </div>
          </div>
        </div>

        <div class="relative mt-6 flex flex-wrap items-center gap-2">
          <button id="back-10" type="button" class="btn min-h-11 bg-slate text-white hover:bg-white/15" aria-label="Back 10 seconds"><span data-icon="rotate-ccw" class="size-4"></span>10s</button>
          <button id="forward-10" type="button" class="btn min-h-11 bg-slate text-white hover:bg-white/15" aria-label="Forward 10 seconds"><span data-icon="rotate-cw" class="size-4"></span>10s</button>
          <button id="speed" type="button" class="btn min-h-11 w-20 bg-slate text-white hover:bg-white/15" aria-label="Playback speed 1x">1x</button>
          <div class="flex items-center gap-2 rounded-full bg-slate pr-4">
            <button id="mute" type="button" class="btn min-h-11 px-3 text-white hover:bg-white/15" aria-label="Mute" aria-pressed="false"><span data-icon="volume-2" class="size-5"></span></button>
            <label for="volume" class="sr-only">Volume</label>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="1" class="w-24 cursor-pointer accent-jacaranda-light">
          </div>
          <p class="ml-auto hidden text-sm text-white/60 md:block">Space = play/pause · ← → = skip 10s</p>
        </div>

        <p id="audio-problem" hidden class="relative mt-6 border-t border-white/10 pt-4 text-white/80" role="alert">
          Your browser can't play this file. <a id="download-link" class="font-semibold text-jacaranda-light underline underline-offset-4" download>Download it</a> or read about it below.
        </p>
      </section>

      <section class="card mt-6 p-6 sm:p-8" aria-labelledby="transcript-heading">
        <h2 id="transcript-heading" class="flex items-center gap-2 text-xl font-bold"><span data-icon="file-text" class="size-5 text-jacaranda"></span>Transcript</h2>
        <p id="transcript-text" hidden class="mt-3 text-lg leading-relaxed whitespace-pre-line text-ink/85"></p>
        <p id="no-transcript" class="mt-3 text-muted">No transcript for this one yet. If you can't listen to it, <a href="mailto:help@jacarandacity.test" class="font-semibold text-jacaranda-deep underline underline-offset-4">email the city</a> and we'll send you the details in writing.</p>
      </section>
    </article>
  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/media-common.js"></script>
  <script src="js/pages/announcement.js"></script>
</body>
</html>
