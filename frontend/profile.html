<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile · Jacaranda City</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/output.css">
</head>
<body>
  <div id="navbar"></div>

  <main id="main" class="mx-auto max-w-3xl px-4 py-10 sm:px-6">
    <h1 class="text-4xl font-extrabold tracking-tight">My profile</h1>

    <div id="profile-loading" class="card mt-8 space-y-4 p-6" aria-busy="true">
      <div class="flex items-center gap-4"><div class="skeleton size-20 rounded-full"></div><div class="flex-1 space-y-2"><div class="skeleton h-6 w-48"></div><div class="skeleton h-5 w-32"></div></div></div>
      <div class="skeleton h-12"></div><div class="skeleton h-12"></div>
    </div>
    <div id="profile-error" class="mt-8" hidden></div>

    <form id="profile-form" hidden class="card mt-8 p-6 sm:p-8" novalidate aria-labelledby="profile-name">
      <div class="flex items-center gap-5">
        <span id="profile-avatar"></span>
        <div>
          <h2 id="profile-name" class="text-2xl font-bold"></h2>
          <div id="profile-chips" class="mt-2 flex flex-wrap gap-2"></div>
        </div>
      </div>

      <hr class="my-6 border-line">

      <div class="space-y-5">
        <div>
          <label for="full_name" class="label">Full name</label>
          <input id="full_name" type="text" maxlength="100" autocomplete="name" class="input" required>
          <p id="full_name-error" class="field-error" hidden></p>
        </div>
        <div>
          <label for="email" class="label">Email</label>
          <input id="email" type="email" autocomplete="email" class="input" required>
          <p id="email-error" class="field-error" hidden></p>
        </div>
        <div class="grid gap-5 sm:grid-cols-2">
          <div>
            <p id="role-label" class="label">Role</p>
            <p class="input flex items-center border-dashed bg-canvas text-ink/80" aria-labelledby="role-label">
              <span id="profile-role" class="capitalize"></span>
              <span class="eyebrow ml-auto flex items-center gap-1 text-muted"><span data-icon="lock" class="size-3.5"></span>Locked</span>
            </p>
          </div>
          <div>
            <p id="status-label" class="label">Account status</p>
            <p class="input flex items-center border-dashed bg-canvas text-ink/80" aria-labelledby="status-label">
              <span id="profile-status"></span>
              <span class="eyebrow ml-auto flex items-center gap-1 text-muted"><span data-icon="lock" class="size-3.5"></span>Locked</span>
            </p>
          </div>
        </div>
        <p class="help">Only an admin can change your account status. Roles can't be changed in the app.</p>
      </div>

      <p id="form-banner" hidden class="mt-6 rounded-xl border border-danger/30 bg-blush p-3 text-sm font-semibold text-danger" role="alert"></p>

      <hr class="my-6 border-line">

      <div class="flex flex-wrap justify-end gap-3">
        <button id="cancel-button" type="button" class="btn-secondary min-h-12 px-7">Cancel</button>
        <button id="save-button" type="submit" class="btn-primary min-h-12 px-7">Save changes</button>
      </div>
    </form>
  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users-common.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
