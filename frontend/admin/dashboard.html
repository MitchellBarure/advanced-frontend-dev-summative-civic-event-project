<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Jacaranda City</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/output.css">
</head>
<body>
  <div class="min-h-screen lg:grid lg:grid-cols-[17rem_1fr]">
    <div id="admin-sidebar"></div>

    <div class="min-w-0">
      <header class="flex flex-wrap items-center justify-between gap-4 border-b border-line bg-white px-4 py-5 sm:px-8">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight">Dashboard</h1>
          <p id="dashboard-date" class="help mt-0.5"></p>
        </div>
        <a href="event-form.html" class="btn-primary"><span data-icon="plus" class="size-4"></span> New event</a>
      </header>

      <main id="main" class="px-4 py-8 sm:px-8">
        <h2 class="sr-only">Totals</h2>
        <div id="stats" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-5" aria-busy="true"></div>
        <!-- charts and more come in stage 7 -->
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
