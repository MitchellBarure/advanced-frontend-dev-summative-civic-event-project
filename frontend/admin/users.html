<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users · Jacaranda City</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/output.css">
</head>
<body>
  <div class="min-h-screen lg:grid lg:grid-cols-[17rem_1fr]">
    <div id="admin-sidebar"></div>

    <div class="min-w-0">
      <header class="flex flex-wrap items-center justify-between gap-4 border-b border-line bg-white px-4 py-5 sm:px-8">
        <h1 class="text-3xl font-extrabold tracking-tight">Users</h1>
        <div class="relative w-full sm:w-80">
          <label for="search" class="sr-only">Search users by name or email</label>
          <span class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-muted"><span data-icon="search" class="size-4"></span></span>
          <input id="search" type="search" placeholder="Search by name or email" class="input rounded-full pl-10">
        </div>
      </header>

      <main id="main" class="px-4 py-8 sm:px-8">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <p class="text-muted">You can turn accounts on or off. Roles can't be changed here.</p>
          <p id="showing" class="eyebrow text-muted" aria-live="polite"></p>
        </div>

        <div class="card relative mt-4 overflow-x-auto">
          <table class="w-full min-w-[48rem] text-left">
            <caption class="sr-only">All accounts, with role, status and an Active switch</caption>
            <thead class="bg-canvas">
              <tr class="eyebrow text-muted">
                <th scope="col" class="px-5 py-4">User</th>
                <th scope="col" class="px-5 py-4">Role</th>
                <th scope="col" class="px-5 py-4">Status</th>
                <th scope="col" class="px-5 py-4">Active</th>
                <th scope="col" class="px-5 py-4"><span class="sr-only">Details</span></th>
              </tr>
            </thead>
            <tbody id="user-rows" class="divide-y divide-line" aria-busy="true"></tbody>
          </table>
        </div>

        <p class="mt-4 flex gap-2 rounded-2xl border border-dashed border-line bg-white p-4 text-sm text-muted">
          <span data-icon="info" class="mt-0.5 size-4 text-sky-text"></span>
          <span>Turning someone off asks you to confirm first. You can't turn off your own account.</span>
        </p>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/users-common.js"></script>
  <script src="../js/pages/admin-users.js"></script>
</body>
</html>
